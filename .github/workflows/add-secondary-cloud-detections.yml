name: Add secondary cloud detections

on:
  push:
    branches: [feature/mvp]
    paths: ['.github/workflows/add-secondary-cloud-detections.yml']

jobs:
  add-detections:
    runs-on: ubuntu-latest
    steps:
      - name: Add missing secondary detections to Cloud Catcher
        shell: bash
        run: |
          set -euo pipefail
          API='https://deploy-preview-1--cloud-catcher-game.netlify.app/api/detections'
          post() {
            curl --fail-with-body -sS -X POST "$API" -H 'content-type: application/json' -d "$1"
            echo
            sleep 4
          }

          post '{"photoId":"6575bf41-f65d-447e-a198-6b838a85cd25","cloudTypeId":"altocumulus","confidence":0.71,"status":"proposed","region":{"type":"rect","x":0.42,"y":0.02,"width":0.50,"height":0.32},"notes":"Smaller patterned elements above the broken low layer; likely Altocumulus, proposed for review.","source":"ai-secondary-review"}'
          post '{"photoId":"deac5b8e-9ecb-4562-827e-91ac2a2cc809","cloudTypeId":"cumulus","confidence":0.67,"status":"proposed","region":{"type":"rect","x":0.05,"y":0.25,"width":0.42,"height":0.30},"notes":"Rounded low convective elements beneath the mixed stratocumulus/altocumulus field; proposed for review.","source":"ai-secondary-review"}'
          post '{"photoId":"60354921-2fc5-42c0-9ee2-cfe81285c6ba","cloudTypeId":"stratocumulus","confidence":0.73,"status":"proposed","region":{"type":"rect","x":0.20,"y":0.24,"width":0.60,"height":0.26},"notes":"A broader low connected layer is also present between the cumulus and smaller altocumulus elements; proposed for review.","source":"ai-secondary-review"}'
          post '{"photoId":"e299faeb-4358-4419-8281-c5cedabd9c83","cloudTypeId":"cumulus","confidence":0.69,"status":"proposed","region":{"type":"rect","x":0.05,"y":0.14,"width":0.42,"height":0.28},"notes":"More isolated sunlit rounded elements within the broken deck resemble Cumulus; proposed for review.","source":"ai-secondary-review"}'
